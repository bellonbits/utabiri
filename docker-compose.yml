services:
  api:
    build: ./backend
    env_file: backend/.env
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - api-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # public URL the *browser* uses to reach the API — baked in at build time,
        # defaults to relative /backend proxy rewrite handled by Next.js
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
    environment:
      - BACKEND_ORIGIN=http://api:8000
    ports:
      - "${WEB_PORT:-3100}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
